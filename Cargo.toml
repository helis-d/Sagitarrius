[package]
name = "sagitarrius"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Local-first secret manager for developers"
license = "MIT"
readme = "README.md"
repository = "https://github.com/helis-d/Sagitarrius"
homepage = "https://github.com/helis-d/Sagitarrius"
documentation = "https://github.com/helis-d/Sagitarrius"
keywords = ["secrets", "password-manager", "cli", "encryption", "vault"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "sagitarrius"
path = "src/main.rs"

# Second binary (Privacy Station broker). Built only with --features
# broker-http or --all-features; the main binary never links HTTP code.
[[bin]]
name = "sagitarrius-broker"
path = "src/broker/main.rs"
required-features = ["broker-http"]

[features]
# HTTP egress for the broker binary ONLY. Enabling this feature does not
# give the main `sagitarrius` binary any network capability (see
# `required-features` above; verify with
# `cargo tree -e normal --bin sagitarrius`).
broker-http = ["dep:ureq", "dep:url"]

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
directories = "5"
fs2 = "0.4"
hkdf = "0.12"
hmac = "0.13"
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
# Broker-only HTTP (PS-01 approved): never used by the main binary.
# ureq = minimal blocking client (rustls TLS); url = strict URL parsing.
ureq = { version = "3", optional = true }
url = { version = "2", optional = true }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
