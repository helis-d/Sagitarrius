name: CI

on:
  push:
  pull_request:

# Least privilege by default; no job here needs to write anything.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master snapshot; toolchain input below selects the channel
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --features broker-http --test broker
      - shell: bash
        run: |
          if cargo tree --locked -e normal | grep -E '(^|[^[:alnum:]_-])(ureq|url|hyper|reqwest) v'; then
            echo 'broker HTTP dependencies must not be in the default tree' >&2
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master snapshot; toolchain input below selects the channel
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master snapshot; toolchain input below selects the channel
        with:
          toolchain: 1.85
      - run: cargo check --locked --all-targets --all-features
