name: Release

# Production release builds. Tags (v*) publish a GitHub Release with
# archives + SHA256SUMS (no signatures yet — see docs/release-security.md).
# workflow_dispatch allows dry runs from any branch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: sagitarrius-linux-x86_64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: sagitarrius-windows-x86_64
            archive: zip
          - os: macos-13
            target: x86_64-apple-darwin
            name: sagitarrius-macos-x86_64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            name: sagitarrius-macos-aarch64
            archive: tar.gz
          # aarch64-unknown-linux-gnu omitted: needs a cross toolchain the
          # hosted runners don't provide. See docs/development.md.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (unix tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          staging="${{ matrix.name }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/sagitarrius" "$staging/"
          cp README.md LICENSE "$staging/"
          tar -czf "$staging.tar.gz" "$staging"
      - name: Package (windows zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "${{ matrix.name }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/sagitarrius.exe", "README.md", "LICENSE" -Destination $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}.${{ matrix.archive }}
          path: ${{ matrix.name }}.${{ matrix.archive }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: sha256sum ./* > SHA256SUMS.txt
        working-directory: dist
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS.txt
          path: dist/SHA256SUMS.txt

  publish:
    needs: [build, checksums]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
